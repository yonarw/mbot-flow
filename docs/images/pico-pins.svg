          <circle cx="280" cy="98" r="4"/><circle cx="280" cy="112" r="4"/><circle cx="280" cy="126" r="4"/><circle cx="280" cy="140" r="4"/><circle cx="280" cy="154" r="4"/><circle cx="280" cy="168" r="4"/><circle cx="280" cy="182" r="4"/><circle cx="280" cy="196" r="4"/><circle cx="280" cy="210" r="4"/><circle cx="280" cy="224" r="4"/><circle cx="280" cy="238" r="4"/><circle cx="280" cy="252" r="4"/><circle cx="280" cy="266" r="4"/><circle cx="280" cy="280" r="4"/><circle cx="280" cy="294" r="4"/>
